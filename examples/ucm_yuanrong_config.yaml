# UCM + Yuanrong Configuration Example
#
# Prerequisites:
#   1. Yuanrong datasystem worker is running
#   2. openyuanrong-datasystem-sdk wheel is installed
#   3. libyuanrongstore.so is built and installed
#   4. NPU device is available
#
# Usage:
#   kv_connector_extra_config={"UCM_CONFIG_FILE": "/path/to/ucm_yuanrong_config.yaml"}

ucm_connectors:
  - ucm_connector_name: "UcmPipelineStore"
    ucm_connector_config:
      store_pipeline: "Yuanrong|Posix"
      yuanrong_host: "127.0.0.1"
      yuanrong_port: 9088
      yuanrong_enable_remote_h2d: true
      storage_backends: "/mnt/test"
      io_direct: true
      share_buffer_capacity_gb: 64

# Wait for the NPU compute event before Yuanrong and Posix read KV cache memory.
enable_event_sync: true

# Sparse attention (optional)
# ucm_sparse_config:
#   GSAOnDevice: {}

# Whether to use layerwise loading/saving (optional, default: True for UCMConnector)
use_layerwise: false
